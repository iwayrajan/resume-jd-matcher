<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<title>Scoring methodology</title>
<desc>Horizontal weighted bar showing how the four scoring components combine into the overall 0-100 match score: skill match 50%, semantic similarity 20%, experience match 15%, education match 15%.</desc>

<text x="30" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#2C2C2A">Overall Score = weighted sum of four components</text>

<!-- Stacked bar -->
<rect x="30" y="70" width="340" height="60" fill="#0F6E56"/>
<rect x="370" y="70" width="136" height="60" fill="#534AB7"/>
<rect x="506" y="70" width="102" height="60" fill="#0B3D62"/>
<rect x="608" y="70" width="102" height="60" fill="#8FA8C2"/>

<text x="200" y="105" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">50%</text>
<text x="438" y="105" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">20%</text>
<text x="557" y="105" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">15%</text>
<text x="659" y="105" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">15%</text>

<!-- Legend -->
<rect x="30" y="170" width="18" height="18" fill="#0F6E56"/>
<text x="56" y="184" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Skill match</text>
<text x="56" y="202" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">Exact + semantic overlap with required skills</text>

<rect x="30" y="220" width="18" height="18" fill="#534AB7"/>
<text x="56" y="234" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Semantic similarity</text>
<text x="56" y="252" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">Overall resume-JD embedding closeness</text>

<rect x="360" y="170" width="18" height="18" fill="#0B3D62"/>
<text x="386" y="184" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Experience match</text>
<text x="386" y="202" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">Years vs. JD's stated minimum</text>

<rect x="360" y="220" width="18" height="18" fill="#8FA8C2"/>
<text x="386" y="234" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Education match</text>
<text x="386" y="252" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">Required qualification present</text>

<text x="30" y="295" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#5F5E5A">Skill match weighted heaviest: it's the most directly actionable signal for a candidate to improve.</text>
</svg>

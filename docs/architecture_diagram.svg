<svg width="700" height="330" viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg">
<title>Resume/JD Matcher architecture</title>
<desc>Two-phase diagram: an extraction phase that turns the resume and job description into structured data, and a scoring phase that combines that data into a weighted match score and generates feedback.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="30" y="55" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="100" y="75" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Upload resume + JD</text>
<text x="100" y="93" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">PDF/DOCX + pasted text</text>

<rect x="195" y="55" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="265" y="75" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Parse to text</text>
<text x="265" y="93" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">pymupdf4llm / python-docx</text>

<rect x="360" y="55" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="430" y="75" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Structured extraction</text>
<text x="430" y="93" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">Groq, JSON mode</text>

<line x1="170" y1="83" x2="195" y2="83" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="335" y1="83" x2="360" y2="83" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="30" y="210" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="100" y="230" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Weighted scoring</text>
<text x="100" y="248" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">Skills, semantic, exp, edu</text>

<rect x="195" y="210" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="265" y="230" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Skill gap detection</text>
<text x="265" y="248" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">Missing must/nice-to-have</text>

<rect x="360" y="210" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="430" y="230" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Feedback generation</text>
<text x="430" y="248" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">Groq</text>

<rect x="525" y="210" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="595" y="230" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Score dashboard</text>
<text x="595" y="248" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">Radar chart + gaps</text>

<line x1="170" y1="238" x2="195" y2="238" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="335" y1="238" x2="360" y2="238" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="500" y1="238" x2="525" y2="238" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<path d="M430 111 L430 150 L100 150 L100 210" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
</svg>
